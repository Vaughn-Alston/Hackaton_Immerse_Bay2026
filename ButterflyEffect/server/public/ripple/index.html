<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ripple</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0c0e; color: #e8e6e3; font: 20px/1.5 system-ui, sans-serif; }
  canvas { display: block; }
  #launch { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; gap: 20px; text-align: center;
            padding: 32px; background: radial-gradient(circle at center, rgba(36, 26, 48, .9), rgba(8, 8, 10, .98) 68%); }
  #launch[hidden] { display: none; }
  #launch h1 { margin: 0; font-size: clamp(46px, 7vw, 86px); line-height: 1; letter-spacing: .08em; font-weight: 650; }
  #launch p { max-width: 620px; margin: 0 auto; color: #c9c5ce; font-size: clamp(20px, 2.5vw, 28px); }
  #begin, #xr button { justify-self: center; font: 600 22px/1.2 system-ui, sans-serif; padding: 15px 26px; border-radius: 999px;
                       border: 1px solid #7a45c8; background: rgba(44, 36, 60, .92); color: #fff; cursor: pointer; }
  #begin:hover, #xr button:hover { border-color: #d9bcff; background: rgba(67, 49, 91, .96); }
  #stop, #status, #voice-status { display: none; }
  #caption { position: fixed; left: 50%; top: 18px; translate: -50% 0; width: min(880px, calc(100% - 40px));
             box-sizing: border-box; padding: 16px 22px; border-radius: 14px; background: rgba(12, 12, 14, .86);
             color: #dedbe2; font-size: clamp(19px, 2vw, 25px); text-align: center; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="launch">
  <h1>THE RIPPLE</h1>
  <p>One ordinary morning. One moment that keeps moving.</p>
  <button id="begin">Enter the story</button>
  <span id="xr"></span>
</div>
<button id="stop" disabled aria-hidden="true"></button>
<span id="status" aria-live="polite"></span>
<span id="voice-status" aria-live="polite"></span>
<div id="caption"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
